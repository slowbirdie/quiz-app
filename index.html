<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>知识闯关 · 互动测验</title>
  <style>
    /* 全局重置，确保嵌入时无额外边距和滚动 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* 默认背景透明，适合嵌入任何底色页面 */
      background: transparent;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;  /* 内边距减小，让内容更贴合 */
    }

    /* 主卡片 - 适配嵌入模式的精致样式 */
    .quiz-card {
      max-width: 650px;
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      transition: all 0.2s ease;
      /* 避免 margin 塌陷引起额外滚动 */
      margin: 0 auto;
    }

    /* 如果通过 URL 参数 ?embed=true 则进一步微调嵌入样式 */
    body.embed-mode .quiz-card {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03), 0 0 0 1px #eef2f6;
      border-radius: 28px;
    }
    body.embed-mode {
      padding: 0;
    }

    /* 头部计分栏 (精致紧凑) */
    .quiz-header {
      background: #ffffffdd;
      padding: 16px 24px 12px 24px;
      border-bottom: 1px solid #eef2f8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .score-board {
      background: #1e2a3e;
      padding: 5px 14px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    .score-board span {
      color: #ffd966;
      font-size: 1.1rem;
      margin-right: 4px;
    }

    .badge-tag {
      background: #eef2ff;
      padding: 4px 12px;
      border-radius: 32px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #1e40af;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* 主体内边距优化 */
    .quiz-body {
      padding: 20px 24px 28px;
    }

    .question-text {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.35;
      color: #0a1c2f;
      background: #fafcff;
      padding: 16px 18px;
      border-radius: 28px;
      border: 1px solid #edf2f7;
      margin-bottom: 8px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 18px 0 16px;
    }

    .option {
      background: white;
      border: 1.5px solid #e6edf4;
      border-radius: 60px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e2f3e;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option:hover:not(.disabled-opt) {
      background: #f4f9fe;
      border-color: #9bc0f0;
      transform: translateX(4px);
    }

    .opt-prefix {
      font-weight: 800;
      background: #eef3fc;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      font-size: 0.8rem;
      color: #2c5f8a;
    }

    .disabled-opt {
      cursor: default;
      opacity: 0.7;
      pointer-events: none;
    }

    .feedback-area {
      margin: 12px 0 0;
      padding: 12px 16px;
      border-radius: 28px;
      background: #f8fafd;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .result-message {
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .result-message.correct { color: #0f6e3f; }
    .result-message.wrong { color: #b91c1c; }

    .next-btn {
      background: #1e2a3e;
      border: none;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }
    .next-btn:hover { background: #0f2b3f; transform: scale(0.97); }

    .auto-skip-tip {
      font-size: 0.7rem;
      color: #2b6e9f;
      background: #e0f0fe;
      padding: 2px 10px;
      border-radius: 50px;
    }

    .loading-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #cbd5e1;
      border-top-color: #2c5f8a;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      font-size: 0.65rem;
      text-align: center;
      padding: 10px 20px 14px;
      color: #8b9bb0;
      border-top: 1px solid #eff3f8;
      background: #fefefe;
    }

    @media (max-width: 560px) {
      .quiz-body { padding: 16px; }
      .question-text { font-size: 1.25rem; padding: 12px; }
      .option { padding: 10px 14px; }
    }
  </style>
</head>
<body>
<div class="quiz-card">
  <div class="quiz-header">
    <div class="badge-tag"><i>🧠</i> 快问快答</div>
    <div class="score-board">🏆 正确 · <span id="scoreCount">0</span> / <span id="totalCount">0</span></div>
  </div>
  <div class="quiz-body">
    <div class="question-text" id="questionText">加载中...</div>
    <div id="optionsContainer" class="options-list"></div>
    <div class="feedback-area">
      <div id="resultText" class="result-message"></div>
      <button id="nextBtn" class="next-btn" style="display: none;">➡ 下一题</button>
    </div>
  </div>
  <footer>✨ 答对自动跳转 · 边玩边学</footer>
</div>

<script>
  // 检测是否为嵌入模式 (根据 URL 参数 embed)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('embed') === 'true') {
    document.body.classList.add('embed-mode');
  }

  // 向父页面报告自身高度，实现 iframe 自动伸缩 (无缝嵌入)
  function reportHeight() {
    if (window.parent !== window) {
      const height = document.body.scrollHeight;
      window.parent.postMessage({ type: 'setHeight', height: height + 10 }, '*');
    }
  }

  let currentQuestion = null;
  let isLocked = false;
  let autoSkipTimer = null;
  let score = 0;
  let totalAnswered = 0;
  let hasAnsweredCurrent = false;

  const questionEl = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const nextBtn = document.getElementById('nextBtn');
  const resultTextEl = document.getElementById('resultText');
  const scoreSpan = document.getElementById('scoreCount');
  const totalSpan = document.getElementById('totalCount');

  function updateScoreUI() {
    scoreSpan.innerText = score;
    totalSpan.innerText = totalAnswered;
    reportHeight(); // 分数变化也可能导致高度变化
  }

  function clearAutoTimer() {
    if (autoSkipTimer) { clearTimeout(autoSkipTimer); autoSkipTimer = null; }
  }

  function resetForNewQuestion() {
    clearAutoTimer();
    isLocked = false;
    hasAnsweredCurrent = false;
    nextBtn.style.display = 'none';
    resultTextEl.innerHTML = '';
    resultTextEl.className = 'result-message';
    // 重新启用选项样式会在渲染时重置
  }

  async function loadQuestion() {
    resetForNewQuestion();
    setLoadingState(true);
    try {
      const res = await fetch('/api/question');
      if (!res.ok) throw new Error();
      const data = await res.json();
      currentQuestion = data;
      renderQuestion(currentQuestion);
      isLocked = false;
      reportHeight(); // 新题目渲染后更新高度
    } catch (err) {
      questionEl.innerText = '⚠️ 题目加载失败，请刷新';
      optionsContainer.innerHTML = '<div style="padding:12px;color:#b91c1c;">连接不到服务器，检查网络后请刷新页面</div>';
      isLocked = true;
    }
    setLoadingState(false);
  }

  function setLoadingState(loading) {
    if (loading) {
      questionEl.innerHTML = '<span class="loading-icon"></span> 加载新题目...';
      optionsContainer.innerHTML = '';
    }
  }

  function renderQuestion(q) {
    questionEl.innerHTML = q.question;
    optionsContainer.innerHTML = '';
    const prefix = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, idx) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<span class="opt-prefix">${prefix[idx]}</span><span style="flex:1">${opt}</span>`;
      div.onclick = () => { if (!isLocked && !hasAnsweredCurrent) checkAnswer(idx); };
      optionsContainer.appendChild(div);
    });
  }

  async function checkAnswer(selectedIdx) {
    if (isLocked || hasAnsweredCurrent) return;
    isLocked = true;
    document.querySelectorAll('.option').forEach(opt => { opt.style.pointerEvents = 'none'; opt.classList.add('disabled-opt'); });
    resultTextEl.innerHTML = '<span class="loading-icon"></span> 校验中...';
    try {
      const res = await fetch('/api/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentQuestion.id, answer: selectedIdx })
      });
      const data = await res.json();
      const isCorrect = data.correct;
      const explanation = data.explanation || (isCorrect ? '🎉 漂亮！' : '再试试下一题～');

      if (!hasAnsweredCurrent) {
        hasAnsweredCurrent = true;
        totalAnswered++;
        if (isCorrect) score++;
        updateScoreUI();
      }

      if (isCorrect) {
        resultTextEl.innerHTML = `✅ 正确！ ${explanation}`;
        resultTextEl.className = 'result-message correct';
        highlightOption(selectedIdx, true);
        clearAutoTimer();
        autoSkipTimer = setTimeout(() => { loadQuestion(); }, 700);
        nextBtn.style.display = 'none';
        const tip = document.createElement('span');
        tip.className = 'auto-skip-tip';
        tip.innerText = '自动跳转下一题';
        resultTextEl.appendChild(tip);
        setTimeout(() => tip.remove(), 650);
      } else {
        resultTextEl.innerHTML = `❌ ${explanation}`;
        resultTextEl.className = 'result-message wrong';
        highlightOption(selectedIdx, false);
        nextBtn.style.display = 'inline-flex';
        clearAutoTimer();
      }
      reportHeight();
    } catch (err) {
      resultTextEl.innerHTML = '⚠️ 请求失败，点击下一题重试';
      resultTextEl.className = 'result-message wrong';
      nextBtn.style.display = 'inline-flex';
      if (!hasAnsweredCurrent) hasAnsweredCurrent = true;
    } finally {
      // 无需额外解锁，等待下一题重置
    }
  }

  function highlightOption(idx, isCorrect) {
    const opts = document.querySelectorAll('.option');
    if (opts[idx]) {
      if (isCorrect) {
        opts[idx].style.backgroundColor = '#e0f9e8';
        opts[idx].style.borderColor = '#2c9a5e';
      } else {
        opts[idx].style.backgroundColor = '#ffe8e8';
        opts[idx].style.borderColor = '#e56c6c';
      }
    }
  }

  nextBtn.addEventListener('click', () => {
    clearAutoTimer();
    loadQuestion();
  });

  // 监听父页面发来的高度请求
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'getHeight') {
      reportHeight();
    }
  });

  // 初始化并初次报告高度
  loadQuestion();
  window.addEventListener('load', () => reportHeight());
  window.addEventListener('resize', () => reportHeight());
  // 每次DOM更新后略微延迟报告高度 (MutationObserver可选，但简单延迟足够)
  setInterval(() => reportHeight(), 800);
</script>
</body>
</html>
