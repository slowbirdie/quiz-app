<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>知识闯关 · 全题型互动测验</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: transparent;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .quiz-card {
      max-width: 700px;
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.03);
      /* 不设置 overflow: hidden，避免内容被意外裁剪（圆角由父级 mask 实现更安全） */
      margin: 0 auto;
    }

    body.embed-mode .quiz-card {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03), 0 0 0 1px #eef2f6;
      border-radius: 28px;
    }
    body.embed-mode { padding: 0; }

    .quiz-header {
      background: #ffffffdd;
      padding: 14px 20px;
      border-bottom: 1px solid #eef2f8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .score-board {
      background: #1e2a3e;
      padding: 6px 16px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .score-board span { color: #ffd966; font-size: 1.1rem; margin-right: 4px; }

    .badge-tag {
      background: #eef2ff;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1e40af;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .quiz-body { padding: 20px 20px 28px; }

    .question-text {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.4;
      color: #0a1c2f;
      background: #fafcff;
      padding: 18px 16px;
      border-radius: 28px;
      border: 1px solid #edf2f7;
      margin-bottom: 16px;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: normal;
    }

    .dynamic-control {
      margin: 16px 0 20px;
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .option, .choice-item {
      background: white;
      border: 1.5px solid #e6edf4;
      border-radius: 60px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 500;
      color: #1e2f3e;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .option:active, .choice-item:active {
      background: #eef3fc;
      transform: scale(0.98);
    }
    .opt-prefix {
      font-weight: 800;
      background: #eef3fc;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 40px;
      font-size: 0.9rem;
      color: #2c5f8a;
      flex-shrink: 0;
    }
    .custom-check, .custom-radio {
      width: 24px;
      height: 24px;
      accent-color: #2c5f8a;
      margin: 0;
      flex-shrink: 0;
      cursor: pointer;
    }
    .choice-item label {
      flex: 1;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1.4;
      padding: 4px 0;
      word-break: break-word;
    }
    /* 判断题组：手机垂直排列，桌面水平居中 */
    .truefalse-group {
      display: flex;
      gap: 16px;
      background: #f8fafd;
      padding: 16px 20px;
      border-radius: 60px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .truefalse-group label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      font-weight: 500;
      padding: 12px 24px;
      background: white;
      border-radius: 60px;
      border: 1px solid #e2eaf1;
      cursor: pointer;
      transition: 0.1s;
      flex: 0 1 auto;
      min-width: 120px;
      justify-content: center;
    }
    .truefalse-group label:active {
      background: #eef3fc;
    }
    @media (max-width: 480px) {
      .truefalse-group {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .truefalse-group label {
        justify-content: center;
      }
    }
    .fill-input {
      width: 100%;
      padding: 16px 20px;
      border-radius: 60px;
      border: 1.5px solid #e2eaf1;
      font-size: 1rem;
      font-family: inherit;
      transition: 0.2s;
      background: white;
    }
    .code-textarea {
      width: 100%;
      padding: 16px 18px;
      border-radius: 28px;
      border: 1.5px solid #e2eaf1;
      font-size: 0.95rem;
      font-family: 'JetBrains Mono', monospace;
      min-height: 140px;
      transition: 0.2s;
      background: white;
      resize: vertical;
    }
    .fill-input:focus, .code-textarea:focus {
      outline: none;
      border-color: #5f9eef;
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.15);
    }

    .feedback-area {
      margin: 16px 0 0;
      padding: 14px 18px;
      border-radius: 32px;
      background: #f8fafd;
      min-height: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 560px) {
      .feedback-area {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }
    .result-message {
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      word-break: break-word;
    }
    .result-message.correct { color: #0f6e3f; }
    .result-message.wrong { color: #b91c1c; }
    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .submit-btn, .next-btn {
      background: #1e2a3e;
      border: none;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      min-width: 110px;
      letter-spacing: 0.5px;
    }
    .submit-btn:active, .next-btn:active {
      background: #0f2b3f;
      transform: scale(0.96);
    }
    .submit-btn:disabled, .next-btn:disabled {
      opacity: 0.5;
      transform: none;
      cursor: not-allowed;
    }
    .auto-skip-tip {
      font-size: 0.75rem;
      color: #2b6e9f;
      background: #e0f0fe;
      padding: 4px 12px;
      border-radius: 50px;
      display: inline-block;
    }
    .loading-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-top-color: #2c5f8a;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer {
      font-size: 0.7rem;
      text-align: center;
      padding: 12px 16px;
      color: #8b9bb0;
      border-top: 1px solid #eff3f8;
      background: #fefefe;
    }
    @media (max-width: 560px) {
      body { padding: 4px; }
      .quiz-body { padding: 16px; }
      .question-text { font-size: 1.25rem; padding: 14px; }
      .option, .choice-item { padding: 12px 16px; min-height: 52px; }
      .opt-prefix { width: 28px; height: 28px; font-size: 0.8rem; }
      .submit-btn, .next-btn { padding: 10px 18px; font-size: 0.9rem; min-width: 90px; }
      .fill-input { padding: 14px 18px; font-size: 0.95rem; }
    }
    .disabled-opt, .option.disabled-opt, .choice-item.disabled-opt {
      pointer-events: none;
      opacity: 0.7;
      background: #f5f7fb;
    }
    input:disabled, textarea:disabled {
      background-color: #f5f7fb;
      color: #6c7a8e;
    }
  </style>
</head>
<body>
<div class="quiz-card">
  <div class="quiz-header">
    <div class="badge-tag"><i>📚</i> 全题型闯关</div>
    <div class="score-board">🏆 正确 · <span id="scoreCount">0</span> / <span id="totalCount">0</span></div>
  </div>
  <div class="quiz-body">
    <div class="question-text" id="questionText">加载中...</div>
    <div id="dynamicControl" class="dynamic-control"></div>
    <div class="feedback-area">
      <div id="resultText" class="result-message"></div>
      <div class="action-buttons">
        <button id="submitBtn" class="submit-btn">✨ 提交答案</button>
        <button id="nextBtn" class="next-btn" style="display: none;">➡ 下一题</button>
      </div>
    </div>
  </div>
  <footer>✍️ 提交答案后自动判题 · 正确自动跳转下一题</footer>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('embed') === 'true') document.body.classList.add('embed-mode');

  // ----- 高度自适应增强 -----
  let reportTimer = null;
  function reportHeight() {
    if (window.parent !== window) {
      if (reportTimer) clearTimeout(reportTimer);
      reportTimer = setTimeout(() => {
        const height = document.body.scrollHeight;
        window.parent.postMessage({ type: 'setHeight', height: height + 12 }, '*');
      }, 30);
    }
  }

  // 监听 DOM 变化 (子树、属性、子节点)
  const observer = new MutationObserver(() => reportHeight());
  observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] });
  // 额外监听窗口大小变化
  window.addEventListener('resize', () => reportHeight());
  // 使用 ResizeObserver 监听根元素尺寸变化（更精确）
  if (window.ResizeObserver) {
    const resizeObserver = new ResizeObserver(() => reportHeight());
    resizeObserver.observe(document.body);
  }
  // 页面加载与卸载时清理
  window.addEventListener('load', () => { reportHeight(); });
  // 监听来自父页面的高度请求
  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'getHeight') reportHeight();
  });
  // 每1.5秒保底报告一次，防止某些极端情况漏报
  setInterval(() => reportHeight(), 1500);
  // ----- 结束自适应部分 -----

  let currentQuestion = null;
  let isLocked = false;
  let autoSkipTimer = null;
  let score = 0;
  let totalAnswered = 0;
  let hasAnsweredCurrent = false;

  const questionEl = document.getElementById('questionText');
  const dynamicControl = document.getElementById('dynamicControl');
  const submitBtn = document.getElementById('submitBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resultTextEl = document.getElementById('resultText');
  const scoreSpan = document.getElementById('scoreCount');
  const totalSpan = document.getElementById('totalCount');

  function updateScoreUI() {
    scoreSpan.innerText = score;
    totalSpan.innerText = totalAnswered;
    reportHeight();
  }

  function clearAutoTimer() {
    if (autoSkipTimer) { clearTimeout(autoSkipTimer); autoSkipTimer = null; }
  }

  function resetForNewQuestion() {
    clearAutoTimer();
    isLocked = false;
    hasAnsweredCurrent = false;
    submitBtn.disabled = false;
    submitBtn.style.display = 'inline-flex';
    nextBtn.style.display = 'none';
    resultTextEl.innerHTML = '';
    resultTextEl.className = 'result-message';
  }

  function collectUserAnswer(type) {
    if (type === 'single') {
      const selected = document.querySelector('input[name="singleOption"]:checked');
      return selected ? parseInt(selected.value) : null;
    } else if (type === 'multiple') {
      const checkboxes = document.querySelectorAll('input[name="multiOption"]:checked');
      return Array.from(checkboxes).map(cb => parseInt(cb.value)).sort((a,b)=>a-b);
    } else if (type === 'truefalse') {
      const selected = document.querySelector('input[name="tfOption"]:checked');
      return selected ? selected.value === 'true' : null;
    } else if (type === 'fill') {
      const input = document.getElementById('fillInput');
      return input ? input.value.trim() : '';
    } else if (type === 'code') {
      const textarea = document.getElementById('codeInput');
      return textarea ? textarea.value.trim() : '';
    }
    return null;
  }

  function renderQuestionByType(q) {
    dynamicControl.innerHTML = '';
    const type = q.type;
    if (type === 'single' && q.options) {
      const container = document.createElement('div');
      container.className = 'options-list';
      const prefix = ['A', 'B', 'C', 'D', 'E'];
      q.options.forEach((opt, idx) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = `
          <input type="radio" name="singleOption" value="${idx}" id="opt_${idx}" style="margin-right: 6px; width: 22px; height: 22px; flex-shrink: 0;">
          <span class="opt-prefix">${prefix[idx]}</span>
          <span style="flex:1; word-break:break-word;">${escapeHtml(opt)}</span>
        `;
        const radio = div.querySelector('input');
        radio.addEventListener('change', (e) => e.stopPropagation());
        div.addEventListener('click', (e) => {
          if (!radio.disabled) radio.checked = true;
        });
        container.appendChild(div);
      });
      dynamicControl.appendChild(container);
    } 
    else if (type === 'multiple' && q.options) {
      const container = document.createElement('div');
      container.className = 'options-list';
      const prefix = ['A', 'B', 'C', 'D', 'E'];
      q.options.forEach((opt, idx) => {
        const div = document.createElement('div');
        div.className = 'choice-item';
        div.innerHTML = `
          <input type="checkbox" name="multiOption" value="${idx}" id="multi_${idx}" class="custom-check">
          <label for="multi_${idx}" style="flex:1; cursor:pointer; word-break:break-word;">${prefix[idx]}. ${escapeHtml(opt)}</label>
        `;
        container.appendChild(div);
      });
      dynamicControl.appendChild(container);
    }
    else if (type === 'truefalse') {
      const tfDiv = document.createElement('div');
      tfDiv.className = 'truefalse-group';
      tfDiv.innerHTML = `
        <label><input type="radio" name="tfOption" value="true"> ✅ 正确</label>
        <label><input type="radio" name="tfOption" value="false"> ❌ 错误</label>
      `;
      dynamicControl.appendChild(tfDiv);
    }
    else if (type === 'fill') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '输入你的答案...';
      input.className = 'fill-input';
      input.id = 'fillInput';
      dynamicControl.appendChild(input);
    }
    else if (type === 'code') {
      const textarea = document.createElement('textarea');
      textarea.placeholder = '// 编写代码或简答\n// 例如: console.log("Hello");';
      textarea.className = 'code-textarea';
      textarea.id = 'codeInput';
      dynamicControl.appendChild(textarea);
    } else {
      dynamicControl.innerHTML = '<div style="padding:12px;color:#888;">暂不支持题型</div>';
    }
    reportHeight();
  }

  // 简单的防XSS
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  function disableControls(type) {
    if (type === 'single') {
      document.querySelectorAll('input[name="singleOption"]').forEach(r => r.disabled = true);
    } else if (type === 'multiple') {
      document.querySelectorAll('input[name="multiOption"]').forEach(cb => cb.disabled = true);
    } else if (type === 'truefalse') {
      document.querySelectorAll('input[name="tfOption"]').forEach(r => r.disabled = true);
    } else if (type === 'fill') {
      const inp = document.getElementById('fillInput');
      if (inp) inp.disabled = true;
    } else if (type === 'code') {
      const ta = document.getElementById('codeInput');
      if (ta) ta.disabled = true;
    }
    document.querySelectorAll('.option, .choice-item').forEach(el => el.classList.add('disabled-opt'));
  }

  async function handleSubmit() {
    if (isLocked || hasAnsweredCurrent || !currentQuestion) return;
    const userAnswer = collectUserAnswer(currentQuestion.type);
    if (userAnswer === null || (currentQuestion.type === 'multiple' && userAnswer.length === 0) ||
        (currentQuestion.type === 'fill' && userAnswer === '') ||
        (currentQuestion.type === 'code' && userAnswer === '')) {
      resultTextEl.innerHTML = '⚠️ 请填写/选择答案后再提交';
      resultTextEl.className = 'result-message wrong';
      return;
    }

    isLocked = true;
    submitBtn.disabled = true;
    disableControls(currentQuestion.type);
    resultTextEl.innerHTML = '<span class="loading-icon"></span> 批阅中...';

    try {
      const res = await fetch('/api/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: currentQuestion.id, answer: userAnswer })
      });
      const data = await res.json();
      const isCorrect = data.correct;
      const explanation = data.explanation || (isCorrect ? '🎉 回答精彩！' : '再试试下一题～');

      if (!hasAnsweredCurrent) {
        hasAnsweredCurrent = true;
        totalAnswered++;
        if (isCorrect) score++;
        updateScoreUI();
      }

      if (isCorrect) {
        resultTextEl.innerHTML = `✅ 正确！ ${escapeHtml(explanation)}`;
        resultTextEl.className = 'result-message correct';
        clearAutoTimer();
        autoSkipTimer = setTimeout(() => { loadQuestion(); }, 700);
        submitBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        const tipSpan = document.createElement('span');
        tipSpan.className = 'auto-skip-tip';
        tipSpan.innerText = '自动跳转下一题';
        resultTextEl.appendChild(tipSpan);
        setTimeout(() => tipSpan?.remove(), 650);
      } else {
        resultTextEl.innerHTML = `❌ ${escapeHtml(explanation)}`;
        resultTextEl.className = 'result-message wrong';
        submitBtn.style.display = 'none';
        nextBtn.style.display = 'inline-flex';
        clearAutoTimer();
      }
      reportHeight();
    } catch (err) {
      resultTextEl.innerHTML = '⚠️ 请求失败，请重试';
      resultTextEl.className = 'result-message wrong';
      submitBtn.disabled = false;
      isLocked = false;
      if (!hasAnsweredCurrent) hasAnsweredCurrent = true;
    }
  }

  async function loadQuestion() {
    resetForNewQuestion();
    setLoading(true);
    try {
      const res = await fetch('/api/question');
      if (!res.ok) throw new Error();
      const data = await res.json();
      currentQuestion = data;
      questionEl.innerHTML = escapeHtml(data.question);
      renderQuestionByType(currentQuestion);
      isLocked = false;
      hasAnsweredCurrent = false;
      submitBtn.disabled = false;
      submitBtn.style.display = 'inline-flex';
      nextBtn.style.display = 'none';
      resultTextEl.innerHTML = '';
      reportHeight();
    } catch (err) {
      questionEl.innerText = '⚠️ 加载题目失败，请刷新页面';
      dynamicControl.innerHTML = '<div style="padding:12px;color:#b91c1c;">无法连接服务器，请检查网络</div>';
      isLocked = true;
    }
    setLoading(false);
  }

  function setLoading(loading) {
    if (loading) {
      questionEl.innerHTML = '<span class="loading-icon"></span> 加载新奇题目...';
      dynamicControl.innerHTML = '';
    }
  }

  nextBtn.addEventListener('click', () => {
    clearAutoTimer();
    loadQuestion();
  });
  submitBtn.addEventListener('click', handleSubmit);

  loadQuestion();
</script>
</body>
</html>
